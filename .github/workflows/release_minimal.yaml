name: Release versioned binaries

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-c:
    if: contains(github.ref_name, '-minimal')
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (using musl)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            container: alpine:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # macOS (no container needed)
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-26
            target: arm64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project name (same as Rust crate name)
        run: echo "PROJECT_NAME=$(sed -n 's/^name = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            apk add --no-cache build-base make linux-headers upx
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools make gcc upx
          # elif [[ "${{ matrix.target }}" == *-apple-darwin ]]; then
          #   brew install upx
          # Skip for MacOS as Mach-O binary compression is not officially supported
          fi

      - name: Extract version information
        id: version
        run: |
          # Extract version from tag or use git describe
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-$(date +%Y%m%d)")
          fi
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%d_%H:%M:%S_UTC")
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=$GIT_COMMIT" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          
          echo "Building version: $VERSION"
          echo "Git commit: $GIT_COMMIT"
          echo "Build date: $BUILD_DATE"

      - name: Build C project
        working-directory: csrc
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          GIT_COMMIT="${{ steps.version.outputs.GIT_COMMIT }}"
          BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            make CC=gcc CFLAGS="-std=c17 -Wall -Wextra -Os -static -ffunction-sections -fdata-sections -Wl,--gc-sections" \
                 VERSION="$VERSION" GIT_COMMIT="$GIT_COMMIT" BUILD_DATE="$BUILD_DATE" ${{ env.PROJECT_NAME }}
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            make CC=musl-gcc CFLAGS="-std=c17 -Wall -Wextra -Os -static -ffunction-sections -fdata-sections -Wl,--gc-sections" \
                 VERSION="$VERSION" GIT_COMMIT="$GIT_COMMIT" BUILD_DATE="$BUILD_DATE" ${{ env.PROJECT_NAME }}
          else
            make CC=clang CFLAGS="-std=c17 -Wall -Wextra -Os" \
                 VERSION="$VERSION" GIT_COMMIT="$GIT_COMMIT" BUILD_DATE="$BUILD_DATE" ${{ env.PROJECT_NAME }}
          fi
          
          # Reduce binary size
          if [[ "${{ matrix.os }}" == "macos"* ]]; then
            strip -x ${{ env.PROJECT_NAME }}
          else
            strip --strip-all ${{ env.PROJECT_NAME }}
            upx --best --lzma ${{ env.PROJECT_NAME }}
          fi
      
      - name: Verify binary architecture and linking
        working-directory: csrc
        run: |
          BINARY="${{ env.PROJECT_NAME }}"
          FILE_BINARY=$(file "$BINARY")
          echo "Binary file info: $FILE_BINARY"

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo "$FILE_BINARY" | grep -q 'x86-64\|x86_64' || { echo "Architecture mismatch!"; exit 1; }
              echo "$FILE_BINARY" | grep -q 'statically linked' || { echo "Not statically linked!"; exit 1; }
              ;;
            aarch64-unknown-linux-musl)
              echo "$FILE_BINARY" | grep -q 'ARM\|aarch64\|arm64' || { echo "Architecture mismatch!"; exit 1; }
              echo "$FILE_BINARY" | grep -q 'statically linked' || { echo "Not statically linked!"; exit 1; }
              ;;
            x86_64-apple-darwin)
              echo "$FILE_BINARY" | grep -q 'x86-64\|x86_64' || { echo "Architecture mismatch!"; exit 1; }
              ;;
            arm64-apple-darwin)
              echo "$FILE_BINARY" | grep -q 'ARM\|aarch64\|arm64' || { echo "Architecture mismatch!"; exit 1; }
              ;;
            *)
              echo "Unknown architecture ${matrix.target}"
              exit 1
              ;;
          esac

      - name: Rename C artifact
        run: |
          cp csrc/${{ env.PROJECT_NAME }} \
             csrc/${{ env.PROJECT_NAME }}-${{ matrix.target }}

      - name: Upload C artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.target }}
          path: csrc/${{ env.PROJECT_NAME }}-${{ matrix.target }}

  release:
    # needs: [build-rust, build-c]
    needs: [build-c]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minimal-latest
          body: |
            This release contains minimal version of ncp: no external dependencies, smallest possible binary.
            Suitable for trusted network environments, such as internal network or VPN.
            For more information, see [specs_minimal.md](specs/specs_minimal.md)
          generate_release_notes: false
          name: Latest minimal 
          files: artifacts/**
          overwrite_files: true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            This release contains minimal version of ncp: no external dependencies, smallest possible binary.
            Suitable for trusted network environments, such as internal network or VPN.
            For more information, see [specs_minimal.md](specs/specs_minimal.md)
          generate_release_notes: false
          name: ${{ github.ref_name }}
          files: artifacts/**
